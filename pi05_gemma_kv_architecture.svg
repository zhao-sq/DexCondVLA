<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 19px; fill: #475569; }
      .section { font-size: 24px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .shape { font-size: 16px; font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #334155; }
      .box { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#arrowOrange); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1260" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="title">π₀.₅：Gemma 2B 与 Gemma 300M 的联合 KV Attention</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">每一层都使用独立 Q/K/V 投影，但在 token 维拼接 K/V，并执行同一次 Grouped-Query Attention</text>

  <text x="60" y="142" class="section">A. 单个 Transformer Layer 内部</text>

  <!-- Stream headers -->
  <rect x="60" y="166" width="650" height="88" class="box" fill="url(#blue)" stroke="#3b82f6"/>
  <text x="385" y="199" text-anchor="middle" class="head">Gemma 2B · 视觉语言 Prefix</text>
  <text x="385" y="227" text-anchor="middle" class="shape">Xₚ: [B, P, 2048]</text>
  <text x="385" y="247" text-anchor="middle" class="small">图像 + 指令 + 离散化状态</text>

  <rect x="890" y="166" width="650" height="88" class="box" fill="url(#orange)" stroke="#f97316"/>
  <text x="1215" y="199" text-anchor="middle" class="head">Gemma 300M · Action Expert</text>
  <text x="1215" y="227" text-anchor="middle" class="shape">Xₐ: [B, A, 1024]</text>
  <text x="1215" y="247" text-anchor="middle" class="small">当前 noisy action chunk</text>

  <!-- Projections -->
  <rect x="75" y="302" width="190" height="100" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="170" y="335" text-anchor="middle" class="head">Wq₂ᴮ</text>
  <text x="170" y="363" text-anchor="middle" class="body">2048 → 8×256</text>
  <text x="170" y="387" text-anchor="middle" class="shape">Qₚ [B,P,8,256]</text>

  <rect x="290" y="302" width="190" height="100" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="385" y="335" text-anchor="middle" class="head">Wk₂ᴮ</text>
  <text x="385" y="363" text-anchor="middle" class="body">2048 → 1×256</text>
  <text x="385" y="387" text-anchor="middle" class="shape">Kₚ [B,P,1,256]</text>

  <rect x="505" y="302" width="190" height="100" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="600" y="335" text-anchor="middle" class="head">Wv₂ᴮ</text>
  <text x="600" y="363" text-anchor="middle" class="body">2048 → 1×256</text>
  <text x="600" y="387" text-anchor="middle" class="shape">Vₚ [B,P,1,256]</text>

  <rect x="905" y="302" width="190" height="100" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1000" y="335" text-anchor="middle" class="head">Wqₑ</text>
  <text x="1000" y="363" text-anchor="middle" class="body">1024 → 8×256</text>
  <text x="1000" y="387" text-anchor="middle" class="shape">Qₐ [B,A,8,256]</text>

  <rect x="1120" y="302" width="190" height="100" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1215" y="335" text-anchor="middle" class="head">Wkₑ</text>
  <text x="1215" y="363" text-anchor="middle" class="body">1024 → 1×256</text>
  <text x="1215" y="387" text-anchor="middle" class="shape">Kₐ [B,A,1,256]</text>

  <rect x="1335" y="302" width="190" height="100" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1430" y="335" text-anchor="middle" class="head">Wvₑ</text>
  <text x="1430" y="363" text-anchor="middle" class="body">1024 → 1×256</text>
  <text x="1430" y="387" text-anchor="middle" class="shape">Vₐ [B,A,1,256]</text>

  <path d="M385 254 L170 296" class="blueLine"/>
  <path d="M385 254 L385 294" class="blueLine"/>
  <path d="M385 254 L600 296" class="blueLine"/>
  <path d="M1215 254 L1000 296" class="orangeLine"/>
  <path d="M1215 254 L1215 294" class="orangeLine"/>
  <path d="M1215 254 L1430 296" class="orangeLine"/>

  <!-- KV concat -->
  <rect x="400" y="470" width="350" height="103" class="box" fill="url(#violet)" stroke="#8b5cf6"/>
  <text x="575" y="503" text-anchor="middle" class="head">K 沿 sequence 维拼接</text>
  <text x="575" y="532" text-anchor="middle" class="shape">K = concat(Kₚ, Kₐ)</text>
  <text x="575" y="557" text-anchor="middle" class="shape">[B, P+A, 1, 256]</text>

  <rect x="850" y="470" width="350" height="103" class="box" fill="url(#violet)" stroke="#8b5cf6"/>
  <text x="1025" y="503" text-anchor="middle" class="head">V 沿 sequence 维拼接</text>
  <text x="1025" y="532" text-anchor="middle" class="shape">V = concat(Vₚ, Vₐ)</text>
  <text x="1025" y="557" text-anchor="middle" class="shape">[B, P+A, 1, 256]</text>

  <path d="M385 402 C385 430 480 436 515 464" class="blueLine"/>
  <path d="M1215 402 C1215 430 670 436 635 464" class="orangeLine"/>
  <path d="M600 402 C600 430 890 436 965 464" class="blueLine"/>
  <path d="M1430 402 C1430 430 1120 436 1085 464" class="orangeLine"/>

  <!-- Joint attention -->
  <rect x="405" y="643" width="790" height="130" class="box" fill="#ffffff" stroke="#334155"/>
  <text x="800" y="680" text-anchor="middle" class="head">Joint Grouped-Query Attention（8 个 Q heads 共用 1 个 KV head）</text>
  <text x="800" y="714" text-anchor="middle" class="shape">softmax(QKᵀ / √256 + mask) · V</text>
  <text x="800" y="745" text-anchor="middle" class="body">Prefix query → 仅 Prefix KV　｜　Action query → Prefix KV + Action KV</text>

  <path d="M170 402 C170 575 480 585 590 637" class="blueLine"/>
  <path d="M1000 402 C1000 575 920 585 865 637" class="orangeLine"/>
  <path d="M575 573 L650 637" class="line"/>
  <path d="M1025 573 L950 637" class="line"/>

  <!-- Outputs -->
  <rect x="155" y="842" width="500" height="102" class="box" fill="url(#blue)" stroke="#3b82f6"/>
  <text x="405" y="875" text-anchor="middle" class="head">Prefix 专属输出投影 Wₒ₂ᴮ</text>
  <text x="405" y="906" text-anchor="middle" class="shape">8×256 → 2048　⇒　[B, P, 2048]</text>
  <text x="405" y="931" text-anchor="middle" class="small">进入下一层 Gemma 2B block</text>

  <rect x="945" y="842" width="500" height="102" class="box" fill="url(#orange)" stroke="#f97316"/>
  <text x="1195" y="875" text-anchor="middle" class="head">Action 专属输出投影 Wₒₑ</text>
  <text x="1195" y="906" text-anchor="middle" class="shape">8×256 → 1024　⇒　[B, A, 1024]</text>
  <text x="1195" y="931" text-anchor="middle" class="small">进入下一层 Expert block；共重复 18 层</text>

  <path d="M650 773 C620 805 480 810 430 836" class="blueLine"/>
  <path d="M950 773 C980 805 1120 810 1170 836" class="orangeLine"/>

  <!-- Inference cache -->
  <line x1="60" y1="996" x2="1540" y2="996" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="1040" class="section">B. 推理时的 Prefix KV Cache</text>

  <rect x="75" y="1070" width="310" height="112" class="box" fill="url(#blue)" stroke="#3b82f6"/>
  <text x="230" y="1105" text-anchor="middle" class="head">Gemma 2B 只运行一次</text>
  <text x="230" y="1136" text-anchor="middle" class="body">为 18 层分别生成 Prefix K/V</text>
  <text x="230" y="1166" text-anchor="middle" class="shape">每层 [B,P,1,256] × 2</text>

  <rect x="475" y="1070" width="310" height="112" class="box" fill="url(#violet)" stroke="#8b5cf6"/>
  <text x="630" y="1105" text-anchor="middle" class="head">固定 KV Cache</text>
  <text x="630" y="1136" text-anchor="middle" class="body">每个 denoising step 复用</text>
  <text x="630" y="1166" text-anchor="middle" class="shape">Kₚ, Vₚ</text>

  <rect x="875" y="1070" width="310" height="112" class="box" fill="url(#orange)" stroke="#f97316"/>
  <text x="1030" y="1105" text-anchor="middle" class="head">Expert 每步重新运行</text>
  <text x="1030" y="1136" text-anchor="middle" class="body">由当前 xₜ 生成 Qₐ/Kₐ/Vₐ</text>
  <text x="1030" y="1166" text-anchor="middle" class="shape">Qₐ attends [Kₚ; Kₐ], [Vₚ; Vₐ]</text>

  <rect x="1275" y="1070" width="250" height="112" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1400" y="1105" text-anchor="middle" class="head">Action Flow</text>
  <text x="1400" y="1137" text-anchor="middle" class="shape">vₜ: [B,A,action_dim]</text>
  <text x="1400" y="1167" text-anchor="middle" class="body">更新 xₜ → xₜ₋dt</text>

  <path d="M385 1126 L467 1126" class="blueLine"/>
  <path d="M785 1126 L867 1126" class="line"/>
  <path d="M1185 1126 L1267 1126" class="orangeLine"/>
  <path d="M1400 1182 C1400 1222 1030 1222 1030 1190" class="dash"/>

  <text x="60" y="1238" class="small">P = prefix token 数；A = action horizon。K 和 V 各为 256 维，而不是 2048/1024；后者是两条 hidden stream 的宽度。</text>
</svg>
